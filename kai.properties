# Kai settings. Edit, then start the app with:
#   java -jar kai.jar --config=/path/to/kai.properties
# If --config is omitted, ./kai.properties (this file) is used.
# Any key here overrides the same key in the built-in application.properties.
# Relative paths resolve from the directory the app is started in.

# ---------------------------------------------------------------- Application
spring.application.name=kai
# server.port=8080

# ---------------------------------------------------------------- Model (Spring AI, OpenAI-compatible gateway)
spring.ai.openai.api-key=${ICA_CODEX_KEY}
# base-url must end with /v1
spring.ai.openai.base-url=${ICA_BASE_URL_V1}
spring.ai.openai.chat.model=gpt-5.6-terra

# ---------------------------------------------------------------- Scan: where to look for documents
# repository: which adapter to use. Available now: local  (later: sharepoint, onedrive)
kai.scan.repository=local
# location: what to scan inside that repository. For local: a folder path.
kai.scan.location=./sampleDocs
# parallel: how many files are checked at the same time. Lower it if the model gateway
# returns rate-limit (429) errors; 1 = one file at a time. Default 4.
kai.scan.parallel=4

# ---------------------------------------------------------------- Backup
# Where original files are copied before any write (one sub-folder per run). Required.
kai.backup-dir=./kai-backups
