# Kai settings. Keep this file in the same folder as the Kai program.
# Lines starting with # are notes and are ignored.
# Paths: relative paths start from THIS file's folder. ~/ means your home folder.
#        Windows paths can be pasted as they are, e.g.  C:\Team\Docs  (quotes are fine too)
# Kai's start page (the first page in the browser) shows these settings, checks them and
# tells you what to fix. You can edit them there; Start Kai saves them back into this file.

# ---------------------------------------------------------------- Folders to scan (at least one)
# Your own computer or a shared drive. Several folders: separate with commas, e.g.
#   kai.scan.local=./docs, ~/Documents/Runbooks, C:\Team\Docs
kai.scan.local=./sampleDocs, /Users/tchoo/Library/CloudStorage/Box-Box/kaitest

# Box folder, by its web address. Not available yet: leave the # in front.
# kai.scan.box=https://box.example.com/folder/123456

# ---------------------------------------------------------------- History folder (required)
# Where Kai keeps a report of every change, with the original files from before it.
# One folder per change; open History.html in it to see them all. Created if missing.
# Must not be inside a folder to scan. (The setting keeps its old name, backup-dir.)
kai.backup-dir=./kai-backups

# ---------------------------------------------------------------- Speed
# How many files are checked at the same time. Lower it if you see "429" or
# "rate limit" errors. 1 = one file at a time. Default 4.
kai.scan.parallel=4

# ---------------------------------------------------------------- AI model (ask your Kai admin)
# Easiest: fill them in on Kai's start page. It tests them, lists the models, and saves them here.
# ${NAME} reads a setting from the computer's environment. You can also paste the value
# directly, e.g.  spring.ai.openai.api-key=sk-...   Keep this file private if you do.
spring.ai.openai.api-key=${ICA_CODEX_KEY}
# base-url ends with /v1 (Kai adds it if missing)
spring.ai.openai.base-url=${ICA_BASE_URL_V1}
spring.ai.openai.chat.model=gpt-5.6-terra

# ---------------------------------------------------------------- Advanced
# Web page address is http://localhost:8080. Change the number if 8080 is already in use.
# server.port=8080
