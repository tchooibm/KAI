spring.application.name=kai
# User-editable settings file, passed at startup: --config=/path/to/kai.properties
# Not optional: a wrong path stops startup with "Config data resource ... does not exist"
# Spring Boot rule: keys in an imported file override the same keys in this file,
# so everything below is only a built-in default.
spring.config.import=file:${config:./kai.properties}
spring.ai.openai.api-key=${ICA_CODEX_KEY}
spring.ai.openai.chat.model=gpt-5.6-terra
spring.ai.openai.base-url=${ICA_BASE_URL_V1}
