spring.application.name=kai
# Built-in defaults. kai.properties (if there is one) is loaded on top of this file,
# so any key there overrides the same key here.
# Kai builds its AI model itself, from the start page (config/ModelProvider),
# so Spring AI's own auto-configured models are switched off.
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
spring.ai.chat.client.enabled=false
