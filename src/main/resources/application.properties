spring.application.name=kai
# Built-in defaults. kai.properties is found and checked by KaiConfig before Spring starts,
# then loaded on top of this file, so any key there overrides the same key here.
spring.ai.openai.api-key=${ICA_CODEX_KEY}
spring.ai.openai.chat.model=gpt-5.6-terra
spring.ai.openai.base-url=${ICA_BASE_URL_V1}
