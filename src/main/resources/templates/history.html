<!DOCTYPE html>
<!-- Two uses: History writes it to <history folder>/History.html after every Finalize (app = false:
     links are relative, so it works without Kai running), and Kai shows it at /history (app = true). -->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kai history</title>
    <style>
        :root { color-scheme: light; --paper: #f6f8f9; --sheet: #fff; --ink: #17252b; --muted: #5f6f76;
                --line: #dde4e7; --teal: #1f5c6b; --error: #b42318; --ok: #1a7f37; }
        * { box-sizing: border-box; }
        body { margin: 0 auto; max-width: 860px; padding: 28px 24px 60px; background: var(--paper); color: var(--ink);
               font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        .top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
        h1 { margin: 0; font: 600 28px/1.2 Charter, "Iowan Old Style", Georgia, serif; }
        .lead { color: var(--muted); margin: 6px 0 22px; max-width: 70ch; }
        code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
        a { color: var(--teal); }
        ol { list-style: none; margin: 0; padding: 0; background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; }
        li { display: grid; grid-template-columns: 170px 1fr auto; gap: 4px 18px; padding: 12px 16px; align-items: baseline; }
        li + li { border-top: 1px solid var(--line); }
        .when { color: var(--muted); font-size: 13px; white-space: nowrap; }
        .what a { font-weight: 500; text-decoration: none; }
        .what a:hover { text-decoration: underline; }
        .outcome { font-size: 13px; white-space: nowrap; }
        .APPLIED { color: var(--ok); }
        .ROLLBACK_INCOMPLETE, .UNFINISHED { color: var(--error); font-weight: 600; }
        .ROLLED_BACK, .NOT_WRITTEN { color: var(--muted); }
        .none { color: var(--muted); }
        @media (max-width: 600px) { li { grid-template-columns: 1fr; } .outcome { white-space: normal; } }
    </style>
</head>
<body>
<div class="top">
    <h1>Kai history</h1>
    <a th:if="${app}" href="/">Back to Kai</a>
</div>
<p class="lead">
    Every change Kai wrote, newest first. Each one has a report with the before and after of every file,
    and its original files in the same folder:
    <code th:text="${folder}"></code>
</p>

<p class="none" th:if="${#lists.isEmpty(runs)}">No changes written yet. They appear here after you click Finalize in Kai.</p>
<ol th:unless="${#lists.isEmpty(runs)}">
    <li th:each="r : ${runs}">
        <span class="when" th:text="${r.when()}"></span>
        <span class="what">
            <a th:href="${app} ? ${r.appHref()} : ${r.fileHref()}" th:target="${app} ? '_blank' : null"
               th:text="${r.headline()}"></a>
        </span>
        <span class="outcome" th:classappend="${r.result()}" th:text="${r.outcome()}"></span>
    </li>
</ol>
</body>
</html>
